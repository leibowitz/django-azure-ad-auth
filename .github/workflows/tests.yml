name: Tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
        django: ['>=5.2.8,<5.3', '>=6.0,<6.1', '>=6.1.3,<6.2']
        include:
          - python: '3.15'
            django: '>=6.1.3,<6.2'
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v6.3.1
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv
      - name: Install package and selected Django version
        env:
          DJANGO_SPEC: ${{ matrix.django }}
        run: uv pip install . "Django${DJANGO_SPEC}"
      - run: uv pip check
      - run: .venv/bin/python -Wd tests/manage.py check
      - run: .venv/bin/python -Wd tests/manage.py test tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v6.3.1
        with:
          python-version: '3.12'
      - run: uv lock --check
      - run: uv build
      - name: Check distribution metadata
        run: uvx --from twine twine check dist/*
